server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't hand scanners a free version number to match against known
    # nginx CVEs — strips it from both the Server header and the default
    # error pages (403/404/50x all show it in the footer otherwise).
    server_tokens off;

    # Security headers — this is the origin the browser actually enforces
    # CSP/framing/MIME-sniffing rules against (the API only ever returns
    # JSON, so its own helmet() headers don't govern page-level behavior).
    # style-src needs 'unsafe-inline': the UI is styled via React inline
    # style={{}} objects throughout, which render as literal style
    # attributes — blocking those would break the whole app's layout.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # script-src/connect-src additions are Google Analytics (see
    # client/src/analytics.js) — a no-op, and these origins unreachable,
    # when VITE_GA_MEASUREMENT_ID isn't set at build time.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API and auth calls go to the api service (container name/DNS
    # resolves via docker-compose or Kubernetes Service). The api container
    # sets its own security headers (helmet()) too — hide the ones this
    # server block already sets above so the browser gets exactly one clean
    # value per header instead of two (nginx's + helmet's stacking into
    # duplicate/conflicting values on the same response).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }
    location /auth/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Content-Security-Policy;
    }

    # nginx's add_header does NOT merge with the parent context once a
    # location defines its own add_header — it's a full reset, not an
    # addition. Both locations below need their own Cache-Control, which
    # means the security headers above have to be repeated here verbatim
    # or every actual page load (bare "/", and every try_files fallback —
    # i.e. nearly all HTML responses) silently ships with none of them.

    # index.html references hashed asset filenames (index-<hash>.js), so it
    # must always be revalidated — otherwise a stale cached index.html can
    # point at long-gone assets or just show an old build after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache aggressively — a new build gets a new hash.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: 4dx-prod
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      # The API never calls the Kubernetes API itself — don't hand a
      # compromised pod cluster credentials it has no use for.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000     # 'node' user baked into node:20-alpine
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: registry.example.com/4dx/api:__TAG__
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # the app is stateless — no runtime disk writes anywhere in server/src
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: 4dx-config }
            - secretRef: { name: 4dx-db-credentials }
            - secretRef: { name: 4dx-okta }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: 4dx-prod
spec:
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: 4dx-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: 4dx-prod
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api }

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: 4dx-prod
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-to-api
  namespace: 4dx-prod
spec:
  podSelector:
    matchLabels: { app: api }
  ingress:
    - from:
        - podSelector: { matchLabels: { app: web } }
      ports: [{ port: 3000 }]
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress
  namespace: 4dx-prod
spec:
  podSelector:
    matchLabels: { app: api }
  egress:
    - to: []
      ports: [{ port: 3306 }, { port: 443 }, { port: 53, protocol: UDP }]
  policyTypes: ["Egress"]

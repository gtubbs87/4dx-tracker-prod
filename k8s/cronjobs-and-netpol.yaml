apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-rollup
  namespace: 4dx-prod
spec:
  schedule: "0 6 * * *"   # 06:00 UTC daily
  jobTemplate:
    spec:
      template:
        # app: api so the existing api-egress NetworkPolicy (DB/HTTPS/DNS)
        # actually applies here too — under default-deny, an unlabeled pod
        # gets none of that and every DB/webhook call in the job just hangs.
        metadata:
          labels: { app: api }
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: rollup
              image: registry.example.com/4dx/api:__TAG__
              command: ["node", "src/jobs/nightlyRollup.js"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              envFrom:
                - configMapRef: { name: 4dx-config }
                - secretRef: { name: 4dx-db-credentials }
---

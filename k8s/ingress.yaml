apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 4dx-ingress
  namespace: 4dx-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    # Explicit even though ingress-nginx defaults to this whenever a tls:
    # block is present — spelled out so it's auditable without relying on
    # the controller's implicit default.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Edge-layer rate limit, on top of (not instead of) the app-level
    # limiter in server.js — defends the ingress controller itself too.
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["4dx.example.com"]
      secretName: 4dx-tls
  rules:
    - host: 4dx.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 3000 } }
          - path: /auth
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 3000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 8080 } }

# Template only — fill in real values and apply directly, or generate with:
#   kubectl create secret generic 4dx-db-credentials -n 4dx-prod \
#     --from-literal=DB_USER=app --from-literal=DB_PASSWORD='...'
# Never commit real secret values to git. In real production, prefer the
# External Secrets Operator pulling from AWS/GCP/Vault instead of this file.

apiVersion: v1
kind: Secret
metadata:
  name: 4dx-db-credentials
  namespace: 4dx-prod
type: Opaque
stringData:
  DB_USER: "app"
  DB_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: 4dx-okta
  namespace: 4dx-prod
type: Opaque
stringData:
  OKTA_CLIENT_ID: "REPLACE_ME"
  OKTA_CLIENT_SECRET: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME_WITH_A_LONG_RANDOM_STRING"
